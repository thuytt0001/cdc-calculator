
[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cdc"
version = "0.0.1"
description = "Complex dc Calculator (RPN) — TDD-first skeleton"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cdc = "cdc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["cdc"]
